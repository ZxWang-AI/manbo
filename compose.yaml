services:
  test-db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: manbo_test
      POSTGRES_USER: manbo
      POSTGRES_PASSWORD: manbo_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - manbo-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manbo -d manbo_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  manbo-test-db:
